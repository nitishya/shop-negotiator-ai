server:
  port: 8080

spring:
  application:
    name: shop-negotiator-backend
  
  datasource:
    url: jdbc:postgresql://localhost:5432/shop_negotiator
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# External Services Configuration
external:
  amazon:
    base-url: ${AMAZON_API_URL:https://api.amazon.com/sandbox}
    api-key: ${AMAZON_API_KEY:mock-amazon-key}
  flipkart:
    base-url: ${FLIPKART_API_URL:https://api.flipkart.net/sandbox}
    api-key: ${FLIPKART_API_KEY:mock-flipkart-key}
  croma:
    base-url: ${CROMA_API_URL:https://api.croma.com/sandbox}
    api-key: ${CROMA_API_KEY:mock-croma-key}
  sarvam:
    base-url: ${SARVAM_API_URL:https://api.sarvam.ai}
    api-key: ${SARVAM_API_KEY:sk_ix46crql_1662KqAOa9CqZoRTfLwFJwTV}

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      shopping-api:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
  retry:
    instances:
      shopping-api:
        maxAttempts: 3
        waitDuration: 2000
